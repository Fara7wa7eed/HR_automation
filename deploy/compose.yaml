name: brightpath-hr

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.7
    restart: unless-stopped
    env_file: ./n8n/.env
    environment:
      TZ: Africa/Cairo
      GENERIC_TIMEZONE: Africa/Cairo
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./gateway/.env
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      N8N_BASE_URL: http://n8n:5678
      TRUST_HTTPS_PROXY: "true"
    depends_on:
      n8n:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:?Set GATEWAY_DOMAIN in deploy/.env}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
